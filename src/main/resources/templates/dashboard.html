<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard | Driver App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        :root {
            --neon:          #00d4ff;
            --neon-green:    #00ffb3;
            --neon-amber:    #ffb700;
            --neon-purple:   #a855f7;
            --bg:            #050810;
            --surface:       #0d1117;
            --surface-2:     #131920;
            --surface-3:     #1a2230;
            --border:        rgba(255,255,255,.07);
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

        /* ── Sidebar ── */
        .sidebar {
            width: 240px; min-height: 100vh;
            background: var(--surface);
            position: fixed; top: 0; left: 0; z-index: 100;
            border-right: 1px solid var(--border);
        }
        .sidebar .brand {
            color: #fff; font-weight: 700; font-size: 15px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .brand-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, var(--neon), #0077ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: #000;
            box-shadow: 0 0 14px rgba(0,212,255,.45);
        }
        .sidebar .nav-link {
            color: #64748b;
            padding: 10px 14px; border-radius: 8px;
            margin: 2px 10px; transition: all .2s;
            font-size: 13.5px; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar .nav-link:hover { color: var(--neon); background: rgba(0,212,255,.06); }
        .sidebar .nav-link.active {
            color: var(--neon);
            background: rgba(0,212,255,.08);
            border: 1px solid rgba(0,212,255,.18);
        }
        .sidebar .nav-link i { font-size: 15px; }
        .sidebar hr { border-color: var(--border); margin: 6px 16px; }
        .sidebar-logout {
            color: #f87171; margin: 2px 10px; border-radius: 8px;
            padding: 10px 14px; font-size: 13.5px; font-weight: 500;
            transition: all .2s; cursor: pointer;
            border: none; background: transparent;
            width: calc(100% - 20px); text-align: left;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-logout:hover { background: rgba(248,113,113,.08); }

        /* ── Layout ── */
        .main-content { margin-left: 240px; }

        /* ── Topbar ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 13px 28px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .topbar h5 { color: #fff; font-size: 15px; font-weight: 600; margin: 0; }
        .topbar h5 i { color: var(--neon); }
        .user-pill {
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 20px; padding: 5px 14px;
            font-size: 13px; color: #64748b;
            display: flex; align-items: center; gap: 7px;
        }
        .user-pill i { color: var(--neon); }

        /* ── Stat Cards ── */
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px;
            transition: border-color .2s, box-shadow .2s;
        }
        .stat-card:hover { border-color: rgba(0,212,255,.3); box-shadow: 0 0 28px rgba(0,212,255,.07); }
        .stat-icon {
            width: 46px; height: 46px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .icon-cyan   { background: rgba(0,212,255,.1);  color: var(--neon);        box-shadow: 0 0 14px rgba(0,212,255,.18); }
        .icon-green  { background: rgba(0,255,179,.1);  color: var(--neon-green);  box-shadow: 0 0 14px rgba(0,255,179,.18); }
        .icon-amber  { background: rgba(255,183,0,.1);  color: var(--neon-amber);  box-shadow: 0 0 14px rgba(255,183,0,.18); }
        .icon-purple { background: rgba(168,85,247,.1); color: var(--neon-purple); box-shadow: 0 0 14px rgba(168,85,247,.18); }
        .stat-label { color: #64748b; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
        .stat-value { color: #fff; font-weight: 700; font-size: 1.8rem; line-height: 1.1; }

        /* ── Panel Cards ── */
        .panel-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .panel-header {
            background: var(--surface-2); border-bottom: 1px solid var(--border);
            padding: 14px 18px; font-size: 13px; font-weight: 600; color: #fff;
            display: flex; align-items: center; justify-content: space-between;
        }
        .panel-header i { color: var(--neon); margin-right: 6px; }

        /* ── Form ── */
        .form-label { color: #64748b; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
        .form-control {
            background: var(--surface-2); border: 1px solid var(--border);
            color: #e2e8f0; border-radius: 8px; font-size: 13.5px;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            background: var(--surface-2); border-color: var(--neon);
            color: #e2e8f0; box-shadow: 0 0 0 3px rgba(0,212,255,.1);
        }
        .form-control::placeholder { color: #2d3f52; }
        /* Native HTML5 invalid state */
        .form-control:invalid:not(:placeholder-shown) {
            border-color: #f87171;
            box-shadow: 0 0 0 3px rgba(248,113,113,.12);
        }

        /* ── Table ── */
        .table { color: #e2e8f0; margin: 0; }
        .table thead th {
            background: var(--surface-2); color: #64748b;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px;
            border-bottom: 1px solid var(--border); border-top: none; padding: 12px 16px;
        }
        .table tbody td { border-color: var(--border); padding: 11px 16px; font-size: 13.5px; vertical-align: middle; }
        .table tbody tr:hover td { background: rgba(0,212,255,.025); }
        .table tbody tr:last-child td { border-bottom: none; }
        .badge-id {
            background: var(--surface-3); color: #64748b;
            font-size: 11px; font-weight: 600; border-radius: 6px;
            padding: 3px 8px; border: 1px solid var(--border);
        }

        /* ── Buttons ── */
        .btn-primary {
            background: linear-gradient(135deg, var(--neon), #0077ff);
            border: none; color: #000; font-weight: 600; font-size: 13.5px;
            box-shadow: 0 0 18px rgba(0,212,255,.3);
            transition: box-shadow .2s, transform .1s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #33ddff, #1a8aff);
            color: #000; box-shadow: 0 0 28px rgba(0,212,255,.45); transform: translateY(-1px);
        }
        .btn-outline-primary { border-color: rgba(0,212,255,.3); color: var(--neon); font-size: 12px; }
        .btn-outline-primary:hover { background: rgba(0,212,255,.1); border-color: var(--neon); color: var(--neon); }
        .btn-outline-danger  { border-color: rgba(248,113,113,.3); color: #f87171; font-size: 12px; }
        .btn-outline-danger:hover  { background: rgba(248,113,113,.1); border-color: #f87171; color: #f87171; }

        /* ── Badge ── */
        .neon-badge {
            background: rgba(0,212,255,.1); color: var(--neon);
            border: 1px solid rgba(0,212,255,.25);
            font-weight: 600; font-size: 11px; border-radius: 20px; padding: 3px 10px;
        }

        /* ── Alerts ── */
        .alert { border-radius: 10px; border: none; font-size: 13.5px; }
        .alert-success { background: rgba(0,255,179,.07); color: var(--neon-green); border: 1px solid rgba(0,255,179,.2); }
        .alert-danger  { background: rgba(248,113,113,.07); color: #f87171; border: 1px solid rgba(248,113,113,.2); }
        .btn-close { filter: invert(1) opacity(.4); }

        /* ── Modal ── */
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
        .modal-header { background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 16px 20px; }
        .modal-title { color: #fff; font-size: 14px; font-weight: 600; }
        .modal-title i { color: var(--neon); }
        .modal-body { padding: 20px; }
        .modal-footer { border-top: 1px solid var(--border); padding: 14px 20px; }
        .btn-light { background: var(--surface-3); border: 1px solid var(--border); color: #64748b; }
        .btn-light:hover { background: var(--surface-2); color: #e2e8f0; border-color: var(--border); }

        .empty-state i { color: var(--surface-3); font-size: 2.5rem; display: block; margin-bottom: 10px; }

        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-person-badge-fill"></i></div>
        DriverApp
    </div>
    <nav class="nav flex-column mt-2">
        <a th:href="@{/}" class="nav-link"><i class="bi bi-house"></i>Home</a>
        <a th:href="@{/dashboard}" class="nav-link active"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <hr/>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="sidebar-logout">
                <i class="bi bi-box-arrow-left"></i>Logout
            </button>
        </form>
    </nav>
</div>

<!-- Main -->
<div class="main-content">
    <div class="topbar">
        <h5><i class="bi bi-speedometer2 me-2"></i>Dashboard</h5>
        <div class="d-flex align-items-center gap-3">
            <div class="user-pill">
                <i class="bi bi-person-circle"></i>
                <span th:text="${username}">User</span>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                    <i class="bi bi-box-arrow-left me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>

    <div class="container-fluid p-4">

        <!-- Alerts -->
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-3">
            <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon icon-cyan"><i class="bi bi-people-fill"></i></div>
                        <div>
                            <div class="stat-label">Total Drivers</div>
                            <div class="stat-value" th:text="${totalDrivers}">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon icon-green"><i class="bi bi-check-circle-fill"></i></div>
                        <div>
                            <div class="stat-label">Active</div>
                            <div class="stat-value" th:text="${activeDrivers}">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon icon-amber"><i class="bi bi-card-checklist"></i></div>
                        <div>
                            <div class="stat-label">Licensed</div>
                            <div class="stat-value" th:text="${licensedDrivers}">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon icon-purple"><i class="bi bi-envelope-fill"></i></div>
                        <div>
                            <div class="stat-label">With Email</div>
                            <div class="stat-value" th:text="${driversWithEmail}">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Add Form -->
            <div class="col-md-4">
                <div class="panel-card">
                    <div class="panel-header">
                        <span><i class="bi bi-plus-circle"></i>Add New Driver</span>
                    </div>
                    <div class="p-4">
                        <form th:action="@{/drivers/add}" th:object="${newDriver}" method="post" id="addDriverForm">
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" th:field="*{firstName}" placeholder="e.g. John" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" placeholder="e.g. Doe" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">License Number</label>
                                <input type="text" class="form-control" th:field="*{licenseNumber}" placeholder="e.g. LIC-001"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control"
                                       th:field="*{phone}"
                                       placeholder="e.g. +1 555 0100"
                                       inputmode="tel"
                                       autocomplete="tel"
                                       pattern="[0-9\s\+\-\(\)]*"
                                       title="Phone number must contain only digits, spaces, +, -, ( ) — no letters allowed."/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       placeholder="e.g. john@example.com"
                                       title="Please enter a valid email address (e.g. john@example.com) — not a phone number."/>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-save me-1"></i>Save Driver
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="col-md-8">
                <div class="panel-card">
                    <div class="panel-header">
                        <span><i class="bi bi-table"></i>All Drivers</span>
                        <span class="neon-badge" th:text="${totalDrivers} + ' total'">0 total</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>#ID</th><th>First Name</th><th>Last Name</th>
                                <th>License</th><th>Phone</th><th>Email</th><th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${drivers.empty}">
                                <td colspan="7" class="text-center py-5 empty-state">
                                    <i class="bi bi-inbox"></i>No drivers yet.
                                </td>
                            </tr>
                            <tr th:each="driver : ${drivers}">
                                <td><span class="badge-id" th:text="${driver.id}"></span></td>
                                <td th:text="${driver.firstName}"></td>
                                <td th:text="${driver.lastName}"></td>
                                <td th:text="${driver.licenseNumber} ?: '—'"></td>
                                <td th:text="${driver.phone} ?: '—'"></td>
                                <td th:text="${driver.email} ?: '—'"></td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target=${'#editModal-' + driver.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form th:action="@{/drivers/delete/{id}(id=${driver.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Delete this driver?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modals -->
<div th:each="driver : ${drivers}">
    <div class="modal fade" th:id="${'editModal-' + driver.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil-square me-1"></i>Edit Driver #<span th:text="${driver.id}"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/drivers/edit/{id}(id=${driver.id})}" th:object="${driver}" method="post" class="edit-driver-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" th:field="*{firstName}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" th:field="*{lastName}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">License Number</label>
                            <input type="text" class="form-control" th:field="*{licenseNumber}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control"
                                   th:field="*{phone}"
                                   inputmode="tel"
                                   autocomplete="tel"
                                   pattern="[0-9\s\+\-\(\)]*"
                                   title="Phone number must contain only digits, spaces, +, -, ( ) — no letters allowed."/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   title="Please enter a valid email address (e.g. john@example.com) — not a phone number."/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
