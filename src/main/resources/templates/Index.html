<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Home | Driver App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --dark: #0e1117;
            --accent: #5b8dee;
            --accent2: #43d9a2;
            --light: #dde3ee;
            --muted: #6b7a90;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                    linear-gradient(rgba(91,141,238,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(91,141,238,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; right: -80px; }
        .blob-2 { width: 350px; height: 350px; background: var(--accent2); bottom: -80px; left: -80px; }

        /* Navbar */
        nav {
            position: fixed;
            top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(14,17,23,0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(91,141,238,0.15);
            border-radius: 16px;
            width: calc(100% - 48px);
            max-width: 900px;
        }

        .brand {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .nav-links { display: flex; gap: 8px; }

        .btn-ghost {
            padding: 7px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: transparent;
            color: var(--light);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        .btn-filled {
            padding: 7px 16px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-filled:hover { background: #4a7de0; color: #fff; }

        /* Hero */
        .hero {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 24px 60px;
            gap: 0;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            border-radius: 100px;
            border: 1px solid rgba(91,141,238,0.25);
            background: rgba(91,141,238,0.07);
            color: #8ab4f8;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            animation: fadeUp 0.5s ease both;
        }

        .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent2);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: clamp(40px, 7vw, 68px);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            animation: fadeUp 0.5s 0.1s ease both;
        }

        .highlight {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: var(--muted);
            line-height: 1.7;
            max-width: 440px;
            margin: 0 auto 40px;
            font-weight: 400;
            animation: fadeUp 0.5s 0.2s ease both;
        }

        .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.5s 0.3s ease both;
        }

        .btn-big {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-big-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px rgba(91,141,238,0.3);
        }
        .btn-big-primary:hover { background: #4a7de0; transform: translateY(-2px); color: #fff; box-shadow: 0 8px 28px rgba(91,141,238,0.4); }

        .btn-big-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--light);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-big-secondary:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); color: var(--light); }

        /* Bottom bar */
        .bottom-bar {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            animation: fadeUp 0.5s 0.4s ease both;
            padding-bottom: 48px;
        }

        .info-strip {
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            overflow: hidden;
        }

        .info-item {
            padding: 18px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 1px solid rgba(255,255,255,0.07);
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }
        .info-item:last-child { border-right: none; }

        .info-icon {
            width: 28px; height: 28px;
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
        }

        .icon-blue { background: rgba(91,141,238,0.15); color: var(--accent); }
        .icon-green { background: rgba(67,217,162,0.15); color: var(--accent2); }
        .icon-purple { background: rgba(167,139,250,0.15); color: #a78bfa; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            nav { top: 8px; width: calc(100% - 24px); padding: 10px 16px; }
            .info-item { padding: 14px 18px; }
            .info-item span { display: none; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- Navbar -->
<nav>
    <a th:href="@{/}" class="brand">
        <div class="brand-icon"><i class="bi bi-person-badge"></i></div>
        DriverApp
    </a>
    <div class="nav-links">
        <a th:href="@{/login}" class="btn-ghost"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
        <a th:href="@{/register}" class="btn-filled"><i class="bi bi-person-plus me-1"></i>Register</a>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div class="pill"><span class="dot"></span> Driver Management</div>
    <h1>Keep track of your<br><span class="highlight">drivers, easily.</span></h1>
    <p class="subtitle">Add, update, and manage driver records without the hassle. Simple, fast, and always organized.</p>
    <div class="cta-row">
        <a th:href="@{/dashboard}" class="btn-big btn-big-primary">
            <i class="bi bi-speedometer2"></i> Open Dashboard
        </a>
        <a th:href="@{/login}" class="btn-big btn-big-secondary">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
        </a>
    </div>
</section>

<!-- Bottom info strip -->
<div class="bottom-bar">
    <div class="info-strip">
        <div class="info-item">
            <div class="info-icon icon-blue"><i class="bi bi-lightning-charge-fill"></i></div>
            <span>Fast updates</span>
        </div>
        <div class="info-item">
            <div class="info-icon icon-green"><i class="bi bi-shield-check"></i></div>
            <span>Secure login</span>
        </div>
        <div class="info-item">
            <div class="info-icon icon-purple"><i class="bi bi-layout-text-window"></i></div>
            <span>Clean dashboard</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
