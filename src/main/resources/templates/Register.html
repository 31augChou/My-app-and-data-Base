<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register | Driver App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        :root {
            --neon:      #00d4ff;
            --bg:        #050810;
            --surface:   #0d1117;
            --surface-2: #131920;
            --surface-3: #1a2230;
            --border:    rgba(255,255,255,.07);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            padding: 40px 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e8f0;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image:
                    linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,.06) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 0;
        }

        .register-wrapper { position: relative; z-index: 1; width: 100%; }

        .back-link {
            color: #64748b; font-size: 13px; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--neon); }

        /* ── Card ── */
        .register-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,.5), 0 0 40px rgba(0,212,255,.04);
        }

        /* ── Header ── */
        .card-header {
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            padding: 28px 24px 22px; text-align: center;
        }
        .brand-icon {
            width: 52px; height: 52px; border-radius: 13px;
            background: linear-gradient(135deg, var(--neon), #0077ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #000;
            box-shadow: 0 0 22px rgba(0,212,255,.45);
            margin: 0 auto 12px;
        }
        .card-header h4 { color: #fff; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
        .card-header p  { color: #64748b; font-size: 13px; margin: 0; }

        /* ── Body ── */
        .card-body { padding: 24px 28px 20px; }

        /* ── Alerts ── */
        .alert { border-radius: 8px; border: none; font-size: 13px; padding: 10px 14px; }
        .alert-danger  { background: rgba(248,113,113,.08); color: #f87171; border: 1px solid rgba(248,113,113,.2); }
        .alert-success { background: rgba(0,255,179,.07);   color: #00ffb3; border: 1px solid rgba(0,255,179,.2); }

        /* ── Labels ── */
        .form-label {
            color: #64748b; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px;
        }

        /* ── Input group ── */
        .input-group-text {
            background: var(--surface-3);
            border: 1px solid var(--border); border-right: none;
            color: var(--neon); font-size: 14px;
        }
        .form-control {
            background: var(--surface-2);
            border: 1px solid var(--border); border-left: none;
            color: #e2e8f0; font-size: 13.5px;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            background: var(--surface-2); border-color: var(--neon);
            color: #e2e8f0; box-shadow: 0 0 0 3px rgba(0,212,255,.1);
        }
        .input-group:focus-within .input-group-text { border-color: var(--neon); }
        .form-control::placeholder { color: #2d3f52; }

        /* ── Submit button ── */
        .btn-primary {
            background: linear-gradient(135deg, var(--neon), #0077ff);
            border: none; color: #000; font-weight: 700; font-size: 14px;
            padding: 11px;
            box-shadow: 0 0 20px rgba(0,212,255,.3);
            transition: box-shadow .2s, transform .1s;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #33ddff, #1a8aff);
            color: #000; box-shadow: 0 0 32px rgba(0,212,255,.5);
            transform: translateY(-1px);
        }

        /* ── Footer ── */
        .card-footer {
            background: var(--surface-2); border-top: 1px solid var(--border);
            padding: 16px 24px; text-align: center;
        }
        .card-footer span { color: #64748b; font-size: 13px; }
        .card-footer a {
            color: var(--neon); font-size: 13px; font-weight: 600;
            text-decoration: none; transition: opacity .2s;
        }
        .card-footer a:hover { opacity: .8; }
    </style>
</head>
<body>
<div class="container register-wrapper">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-9 col-11">
            <div class="text-center mb-3">
                <a th:href="@{/}" class="back-link"><i class="bi bi-arrow-left"></i>Back to Home</a>
            </div>
            <div class="register-card">
                <div class="card-header">
                    <div class="brand-icon"><i class="bi bi-person-plus-fill"></i></div>
                    <h4>Create Account</h4>
                    <p>Fill in your details to register</p>
                </div>
                <div class="card-body">
                    <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center mb-3">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
                    </div>
                    <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
                    </div>
                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" th:field="*{firstName}" placeholder="John" required/>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" th:field="*{lastName}" placeholder="Doe" required/>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-at"></i></span>
                                <input type="text" class="form-control" th:field="*{username}" placeholder="Choose a username" required/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="john@example.com" required/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" th:field="*{password}" placeholder="Create a password" required/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Repeat your password" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>
                    </form>
                </div>
                <div class="card-footer">
                    <span>Already have an account?</span>
                    <a th:href="@{/login}" class="ms-1">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
