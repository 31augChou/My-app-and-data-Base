<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register | Driver App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #1a1a2e, #0f3460); display: flex; align-items: center; justify-content: center; padding: 40px 0; }
        .register-card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-9">
            <div class="text-center mb-3">
                <a th:href="@{/}" class="text-white text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </div>
            <div class="card register-card">
                <div class="card-header bg-dark text-white text-center py-4" style="border-radius:16px 16px 0 0">
                    <i class="bi bi-person-plus display-5 d-block mb-2"></i>
                    <h4 class="fw-bold mb-0">Create Account</h4>
                    <p class="text-white-50 small mb-0">Fill in your details to register</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
                    </div>
                    <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
                    </div>
                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" th:field="*{firstName}" placeholder="John" required/>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" th:field="*{lastName}" placeholder="Doe" required/>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-at"></i></span>
                                <input type="text" class="form-control" th:field="*{username}" placeholder="Choose a username" required/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="john@example.com" required/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" th:field="*{password}" placeholder="Create a password" required/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Repeat your password" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center bg-light py-3">
                    <span class="text-muted small">Already have an account?</span>
                    <a th:href="@{/login}" class="fw-semibold text-decoration-none ms-1">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
